version: '3.8'

services:
  deeplog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deeplog-siem
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEEPLOG_JWT_SECRET=production-secret-change-in-production-env
      - DEEPLOG_DB_ENCRYPTION_KEY=deeplog-master-encryption-key-32b!
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
