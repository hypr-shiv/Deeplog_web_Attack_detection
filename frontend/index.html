<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1419" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://*.tile.openstreetmap.org https://basemaps.cartocdn.com;
        connect-src 'self' ws://127.0.0.1:8000 ws://127.0.0.1:5173 wss://* http://127.0.0.1:8000 http://127.0.0.1:5173;
        worker-src 'self' blob:;
        child-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
      "
    />
    <!-- Primary Meta Tags -->
    <title>DeepLog SIEM — Real-Time ML Cyber Threat Detection &amp; Geolocation Platform</title>
    <meta name="title" content="DeepLog SIEM — Real-Time ML Cyber Threat Detection &amp; Geolocation Platform" />
    <meta
      name="description"
      content="High-performance cybersecurity dashboard and SIEM platform ingesting system logs, classifying web attacks (SQLi, XSS, Path Traversal) via Random Forest ML, and geolocating threat actors in real time."
    />
    <meta name="keywords" content="SIEM, Cybersecurity, Machine Learning, Web Attack Detection, SQL Injection, XSS, Threat Intelligence, GeoIP, DevSecOps, SOC Console" />
    <meta name="author" content="DeepLog Security Operations" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://127.0.0.1:5173" />
    <meta property="og:title" content="DeepLog SIEM — Real-Time ML Cyber Threat Detection &amp; Geolocation Platform" />
    <meta
      property="og:description"
      content="High-performance cybersecurity dashboard and SIEM platform ingesting system logs, classifying web attacks via Random Forest ML, and geolocating threat actors in real time."
    />
    <meta property="og:site_name" content="DeepLog SIEM" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeepLog SIEM — Real-Time ML Cyber Threat Detection &amp; Geolocation Platform" />
    <meta
      name="twitter:description"
      content="High-performance cybersecurity dashboard and SIEM platform ingesting system logs, classifying web attacks via Random Forest ML, and geolocating threat actors in real time."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
